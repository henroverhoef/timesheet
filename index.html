<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Log time per client and see day, week and month summaries. Works offline; everything stays on this phone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timesheet">
<title>Client Timesheet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Fraunces";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fraunces-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fraunces-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
:root{
  /* Layout: phone-first single screen. Header with save status, scrolling view, bottom tabs. Summary first, detail one tap away. */
  --paper:#F3F6F4;
  --surface:#FFFFFF;
  --ink:#13241E;
  --muted:#5A6C65;
  --line:#D8E1DD;
  --accent:#1D6A4F;
  --accent-soft:#E1EEE8;
  --on-accent:#FFFFFF;
  --amber:#9A5A00;
  --amber-soft:#FCEFD8;
  --danger:#B42318;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius:14px;
  --radius-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1513; --surface:#16201C; --ink:#E4EDE9; --muted:#93A69E; --line:#283530;
    --accent:#5CC197; --accent-soft:#1B3029; --on-accent:#0B1A13;
    --amber:#F2A93B; --amber-soft:#33270F; --danger:#F48A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1513; --surface:#16201C; --ink:#E4EDE9; --muted:#93A69E; --line:#283530;
  --accent:#5CC197; --accent-soft:#1B3029; --on-accent:#0B1A13;
  --amber:#F2A93B; --amber-soft:#33270F; --danger:#F48A80;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--paper)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--font-display);font-weight:600;font-size:1.5rem;letter-spacing:-.01em;line-height:1.2}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:.75rem;font-weight:500;cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-tone="ok"] i{background:var(--accent)}
.sync[data-tone="busy"] i{background:var(--amber)}
.sync[data-tone="warn"] i{background:var(--danger)}

.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px calc(env(safe-area-inset-right) + 16px) 28px calc(env(safe-area-inset-left) + 16px);display:flex;flex-direction:column;gap:16px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 8px)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-size:.75rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.section-h{font-size:.8125rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.list-head h2{font-size:1.0625rem;font-weight:600}

/* Forms */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:.8125rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.input{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;width:100%;min-height:46px;-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--muted);opacity:.75}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.input{min-height:88px;resize:vertical;line-height:1.4}
input[type="date"].input{display:block}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.date-row{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:8px}
.dur{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dur .input{width:76px;text-align:center;font-family:var(--font-num);font-size:1.125rem}
.unit{color:var(--muted);font-size:.9375rem}
.dec{margin-left:auto;color:var(--muted);font-size:.875rem}
.form-error{margin:0;color:var(--danger);font-size:.9375rem;font-weight:500}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips-scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-overflow-scrolling:touch}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .chip{flex:none;max-width:240px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.875rem;min-height:36px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip-quiet{color:var(--muted);border-style:dashed}

/* Buttons */
.btn{appearance:none;border:1px solid transparent;border-radius:12px;min-height:48px;padding:10px 16px;font-weight:600;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-amber{background:var(--amber);color:var(--surface)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-text{background:transparent;color:var(--danger);border-color:var(--line)}
.btn-sm{min-height:40px;padding:8px 14px;font-size:.9375rem}
.btn-block{width:100%}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-col{display:flex;flex-direction:column;gap:10px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);width:46px;min-height:46px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.link{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:.875rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Timer */
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px dashed var(--line);border-radius:var(--radius)}
.timer-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.timer-title{font-weight:600;font-size:.9375rem}
.timer-hint{color:var(--muted);font-size:.8125rem}
.timer.is-running{border:1px solid var(--amber);background:var(--amber-soft)}
.timer.is-running .timer-title{color:var(--amber);font-size:.8125rem}
.timer-elapsed{font-size:1.5rem;font-weight:600}
.timer-actions{display:flex;gap:6px;flex:none}

/* Entry lists */
.list{padding:0 16px}
.entry{appearance:none;border:0;background:none;width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.list > .entry:first-child,.list > .date-h:first-child{border-top:0}
.e-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.e-client{font-weight:600;overflow-wrap:anywhere}
.e-desc{color:var(--muted);font-size:.9375rem;overflow-wrap:anywhere}
.e-desc-strong{color:var(--ink);font-size:.9375rem;overflow-wrap:anywhere}
.e-time{font-weight:600;align-self:start;white-space:nowrap}
.date-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0 2px;border-top:1px solid var(--line);font-size:.8125rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.month-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 2px -6px;font-weight:600}
.empty{color:var(--muted);text-align:left}
.empty p{margin:0 0 6px}
.empty strong{color:var(--ink)}
.empty .btn{margin-top:10px}

/* Banner */
.banner .link{white-space:nowrap}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);color:var(--ink);border-radius:var(--radius-sm);padding:10px 12px;font-size:.875rem}
.banner.warn{background:var(--amber-soft)}

/* Summary */
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:none;border-radius:9px;min-height:38px;font-weight:600;font-size:.9375rem;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.period{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:8px;align-items:center}
.period-label{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}
.period-label strong{font-size:1.0625rem;font-weight:600}
.period-label .muted{font-size:.8125rem}
.total-fig{font-family:var(--font-display);font-weight:600;font-size:2.5rem;line-height:1.05;font-variant-numeric:tabular-nums lining-nums}
.total-sub{color:var(--muted);font-size:.875rem;margin-top:4px}
.chart{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.chart-max{font-size:.75rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px}
.bars-month{gap:2px}
.bar{appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;color:var(--muted)}
.bar-track{height:92px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) top/100% 1px no-repeat}
.bar-fill{display:block;width:100%;background:var(--accent);opacity:.72;border-radius:3px 3px 0 0}
.bar.is-zero .bar-fill{opacity:0}
.bar.is-today .bar-fill{opacity:1}
.bar-lbl{font-size:.6875rem;text-align:center;height:14px;line-height:14px;white-space:nowrap;overflow:visible}
.bar.is-today .bar-lbl{color:var(--ink);font-weight:600}

.crow{appearance:none;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.crow-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.crow-name{font-weight:600;font-size:1.0625rem;overflow-wrap:anywhere}
.crow-time{font-weight:600;font-size:1.0625rem;white-space:nowrap}
.crow-bar{display:block;height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.crow-bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.crow-tasks{display:flex;flex-direction:column;gap:2px;font-size:.9375rem}
.crow-task{display:block;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-task::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 8px 2px 1px;vertical-align:middle}
.crow-more{color:var(--muted);font-size:.875rem;padding-left:14px}
.crow-meta{display:flex;justify-content:space-between;gap:12px;font-size:.8125rem;color:var(--muted)}
.crow-go{color:var(--accent);font-weight:600;white-space:nowrap}

/* Detail */
.back{appearance:none;border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.back svg{width:18px;height:18px}
.detail-name{font-family:var(--font-display);font-size:1.625rem;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.detail-sub{margin:4px 0 0;color:var(--muted)}
.archived-tag{display:inline-block;font-size:.75rem;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}

/* Clients */
.find-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ac-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ac-list[hidden]{display:none}
.ac-item{appearance:none;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px;min-height:46px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1rem}
.ac-item:first-child{border-top:0}
.ac-item mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.ac-item small{color:var(--muted);font-size:.8125rem;white-space:nowrap}
.ac-item.is-new{color:var(--accent);font-weight:600}
.ac-status{font-size:.8125rem;font-weight:600;color:var(--accent);margin:0}
.ac-status[hidden]{display:none}
.import-preview{font-size:.9375rem;color:var(--muted);margin:0}
.import-preview strong{color:var(--ink)}
.cl-sub{color:var(--muted);font-size:.875rem}

/* Settings */
.set-card{display:flex;flex-direction:column;gap:12px}
.set-card h2{font-size:1.0625rem;font-weight:600}
.set-card p{margin:0;color:var(--muted);font-size:.9375rem}
.status-line{display:flex;gap:10px;align-items:flex-start;font-size:.9375rem}
.status-line i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.status-line i.ok{background:var(--accent)}
.status-line i.busy{background:var(--amber)}
.status-line i.warn{background:var(--danger)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;padding-top:4px;border-top:1px solid var(--line);padding-top:12px}
.switch-row strong{display:block;font-weight:600}
.switch-row small{display:block;color:var(--muted);font-size:.875rem;margin-top:2px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(8,18,14,.45)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 16px);display:flex;flex-direction:column;gap:16px;transform:translateY(16px);opacity:0;transition:transform .18s ease,opacity .18s ease}
.sheet-wrap.open .sheet{transform:none;opacity:1}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-h h2{font-family:var(--font-display);font-size:1.375rem;font-weight:600}
.sheet p{margin:0}
.sheet textarea.copy-area{font-family:var(--font-num);font-size:.8125rem;min-height:220px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:30;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:.9375rem;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);width:max-content;transition:opacity .18s,transform .18s;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{appearance:none;border:0;background:none;color:var(--accent-soft);font-weight:700;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title">Log time</h1>
    <button class="sync" id="syncPill" type="button" data-action="tab" data-tab="settings" aria-label="Where your entries are saved"><i></i><span id="syncText">On this phone</span></button>
  </header>
  <main class="view" id="view"></main>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" type="button" data-action="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Log</button>
    <button class="tab" type="button" data-action="tab" data-tab="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/><path d="M3 20h18"/></svg>Summary</button>
    <button class="tab" type="button" data-action="tab" data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M21 19v-1a4 4 0 0 0-3-3.87M15.5 4.13a3.5 3.5 0 0 1 0 6.75"/></svg>Clients</button>
    <button class="tab" type="button" data-action="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</button>
  </nav>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" data-action="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<datalist id="clientNames"></datalist>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ helpers */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const newId = () => now().toString(36) + Math.random().toString(36).slice(2, 9);
const pad = (n) => String(n).padStart(2, '0');

const toStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromStr = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };

  const d = fromStr(s); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);

  d.setDate(Math.min(day, last)); return toStr(d);

function range(mode, anchor) {
  if (mode === 'all') return { from: '0000-01-01', to: '9999-12-31' };
  if (mode === 'day') return { from: anchor, to: anchor };
  if (mode === 'week') { const f = weekStart(anchor); return { from: f, to: addDays(f, 6) }; }
  const d = fromStr(anchor);
  return { from: toStr(new Date(d.getFullYear(), d.getMonth(), 1, 12)), to: toStr(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12)) };
}

const LOCALE = 'en-GB'; /* day-month-year, Monday-first weeks */
const dtfCache = {};
const fmt = (s, o) => { const k = JSON.stringify(o); if (!dtfCache[k]) dtfCache[k] = new Intl.DateTimeFormat(LOCALE, o); return dtfCache[k].format(fromStr(s)); };
const fmtDayShort = (s) => fmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDayLong = (s) => fmt(s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtDM = (s) => fmt(s, { day: 'numeric', month: 'short' });
const fmtMonth = (s) => fmt(s, { month: 'long', year: 'numeric' });
const hhmm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function periodLabel(mode, r) {
  if (mode === 'all') return 'All time';
  if (mode === 'day') return fmtDayLong(r.from);
  if (mode === 'month') return fmtMonth(r.from);
  const y1 = r.from.slice(0, 4), y2 = r.to.slice(0, 4);
  return y1 === y2 ? `${fmtDM(r.from)} – ${fmtDM(r.to)} ${y2}` : `${fmtDM(r.from)} ${y1} – ${fmtDM(r.to)} ${y2}`;
}
const fmtDur = (m) => { m = Math.max(0, Math.round(m || 0)); const h = Math.floor(m / 60), r = m % 60; if (!h && !r) return '0h'; if (!h) return `${r}m`; if (!r) return `${h}h`; return `${h}h ${pad(r)}m`; };
const fmtDec = (m) => (Math.round(((m || 0) / 60) * 100) / 100).toFixed(2);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const slug = (s) => String(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'client';
function parseDur(hs, ms) {
  const h = parseFloat(String(hs == null ? '' : hs).replace(',', '.'));
  const m = parseInt(String(ms == null ? '' : ms), 10);
  return Math.max(0, Math.round((isFinite(h) ? h : 0) * 60 + (isFinite(m) ? m : 0)));
}
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0));

/* -------------------------------------------------------------------- state */
const LS_KEY = 'client-timesheet.v1';
const UI_KEY = 'client-timesheet.ui';
const state = { entries: {}, clients: {}, settings: { round: 6, lastFileBackup: 0 }, timer: null };
const ui = { tab: 'log', sumMode: 'week', sumAnchor: todayStr(), detail: null, clientFilter: '', showArchived: false };
let draft = { date: todayStr(), client: '', h: '', m: '', desc: '' };
let storageOk = true;
let lastToday = todayStr();

function cleanEntry(e) {
  if (!e || typeof e !== 'object' || typeof e.id !== 'string' || !e.id || !isDateStr(e.date)) return null;
  const out = {
    id: e.id, date: e.date, clientId: String(e.clientId || ''),
    minutes: Math.max(0, Math.min(1440, Math.round(Number(e.minutes) || 0))),
    desc: String(e.desc || '').slice(0, 2000),
    createdAt: Number(e.createdAt) || 0, updatedAt: Number(e.updatedAt) || 0,
  };
  if (e.deleted) out.deleted = true;
  if (e.sample) out.sample = true;
  return out;
}
function cleanClient(c) {
  if (!c || typeof c !== 'object' || typeof c.id !== 'string' || !c.id) return null;
  const out = { id: c.id, name: String(c.name || '').trim().slice(0, 120) || 'Unnamed client', updatedAt: Number(c.updatedAt) || 0 };
  if (c.archived) out.archived = true;
  if (c.deleted) out.deleted = true;
  if (c.sample) out.sample = true;
  return out;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      for (const e of Object.values(s.entries || {})) { const c = cleanEntry(e); if (c) state.entries[c.id] = c; }
      for (const c of Object.values(s.clients || {})) { const k = cleanClient(c); if (k) state.clients[k.id] = k; }
      if (s.settings && typeof s.settings === 'object') {
        state.settings.round = [1, 6, 15].includes(s.settings.round) ? s.settings.round : 6;
        state.settings.lastFileBackup = Number(s.settings.lastFileBackup) || 0;
      }
      if (s.timer && Number(s.timer.start)) state.timer = { start: Number(s.timer.start) };
    }
    const u = JSON.parse(localStorage.getItem(UI_KEY) || 'null');
    if (u && ['log', 'summary', 'clients', 'settings'].includes(u.tab)) ui.tab = u.tab;
    if (u && ['day', 'week', 'month'].includes(u.sumMode)) ui.sumMode = u.sumMode;
  } catch (e) { storageOk = false; }
}
function saveLocal() {
  try {
    const keep = (o) => { const out = {}; for (const k in o) if (!o[k].deleted) out[k] = o[k]; return out; };
    localStorage.setItem(LS_KEY, JSON.stringify({ entries: keep(state.entries), clients: keep(state.clients), settings: state.settings, timer: state.timer }));
    storageOk = true;
  } catch (e) { storageOk = false; }
  renderSyncPill();
}
function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify({ tab: ui.tab, sumMode: ui.sumMode })); } catch (e) { /* not important */ } }

const liveEntries = () => Object.values(state.entries).filter((e) => !e.deleted);
const liveClients = () => Object.values(state.clients).filter((c) => !c.deleted);
const clientName = (id) => { const c = state.clients[id]; return c && !c.deleted ? c.name : 'Unknown client'; };
const normName = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
/* Search is forgiving ("johnmark" finds "John-Mark"), but saved names are exact:
   "John-Mark" and "John Mark" are different clients. Only capitals and extra spaces are ignored. */
const fold = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const nameKey = (s) => fold(s).replace(/[^a-z0-9]+/g, '');
const nameWords = (s) => fold(s).split(/[^a-z0-9]+/).filter(Boolean);
const keyCache = new Map();
const keyOf = (name) => { let k = keyCache.get(name); if (k === undefined) { k = nameKey(name); keyCache.set(name, k); } return k; };
const findClientByName = (name) => {
  const k = normName(name); if (!k) return null;
  const all = liveClients().filter((c) => normName(c.name) === k);
  return all.find((c) => !c.archived) || all[0] || null;
};
function editDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
/* Ranked client search: same key, starts with, every typed word starts a word, contains, then small typos. */
function searchClients(q, limit, includeArchived) {
  const k = nameKey(q); if (!k) return [];
  const qw = nameWords(q);
  const maxTypos = k.length <= 3 ? 0 : k.length <= 6 ? 1 : 2;
  const hits = [];
  for (const c of liveClients()) {
    if (c.archived && !includeArchived) continue;
    const ck = keyOf(c.name);
    let score = 0;
    if (ck === k) score = 100;
    else if (ck.startsWith(k)) score = 80;
    else {
      const cw = nameWords(c.name);
      if (qw.length && qw.every((w) => cw.some((x) => x.startsWith(w)))) score = 70;
      else if (ck.includes(k)) score = 60;
      else if (maxTypos) {
        const d = Math.min(editDistance(k, ck, maxTypos), editDistance(k, ck.slice(0, k.length), maxTypos));
        if (d <= maxTypos) score = 40 - d * 10;
      }
    }
    if (score && normName(c.name).startsWith(normName(q))) score += 5;
    if (score) hits.push({ c, score });
  }
  hits.sort((a, b) => b.score - a.score || (a.c.archived ? 1 : 0) - (b.c.archived ? 1 : 0) || a.c.name.length - b.c.name.length || a.c.name.localeCompare(b.c.name));
  return hits.slice(0, limit || 8).map((h) => h.c);
}
function highlight(name, q) {
  const t = String(q || '').trim(); const i = t ? name.toLowerCase().indexOf(t.toLowerCase()) : -1;
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + t.length)) + '</mark>' + esc(name.slice(i + t.length));
}
const newClientOk = new Set();
/* Suggestion list under a client box. Tapping a name fills it in, spelt exactly as saved. */
function renderAc(inputId, force) {
  const input = $('#' + inputId), box = $('#' + inputId + '-ac'), status = $('#' + inputId + '-status');
  if (!input || !box) return;
  const q = input.value.trim().replace(/\s+/g, ' ');
  const match = q ? findClientByName(q) : null;
  if (status) {
    status.hidden = !(match && match.name === q);
    status.textContent = match && match.archived ? '✓ From your client list (archived)' : '✓ From your client list';
  }
  if (!q || (match && match.name === q) || (!force && document.activeElement !== input && !box.dataset.keep)) { box.hidden = true; box.innerHTML = ''; return; }
  const hits = searchClients(q, 6, true);
  let html = hits.map((c) => `<button type="button" class="ac-item" data-action="ac-pick" data-input="${inputId}" data-id="${esc(c.id)}"><span>${highlight(c.name, q)}</span>${c.archived ? '<small>archived</small>' : ''}</button>`).join('');
  if (!match) html += `<button type="button" class="ac-item is-new" data-action="ac-new" data-input="${inputId}">+ Add “${esc(q)}” as a new client</button>`;
  box.innerHTML = html; box.hidden = !html;
  if (force) box.dataset.keep = '1';
}
/* Returns true when the typed client is fine to save; otherwise shows the choices. */
function checkClient(inputId, errId) {
  const input = $('#' + inputId);
  const q = input.value.trim().replace(/\s+/g, ' ');
  if (findClientByName(q) || newClientOk.has(normName(q))) return true;
  renderAc(inputId, true);
  showError(errId, `“${q}” isn't in your client list. Tap the right name above, or add it as a new client.`);
  input.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return false;
}
/* ---- importing a client list */
function splitDelimited(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"' && !cur.trim()) q = true;
    else if (ch === d) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur); return out;
}
function parseClientList(text, isCsv) {
  const lines = String(text || '').replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).filter((l) => l.trim());
  const sample = lines.slice(0, 30);
  let delim = null;
  if (sample.some((l) => l.includes('\t'))) delim = '\t';
  else if (isCsv) {
    const semi = sample.filter((l) => l.includes(';')).length, comma = sample.filter((l) => l.includes(',')).length;
    delim = semi > comma ? ';' : ',';
  }
  let rows = lines.map((l) => (delim ? splitDelimited(l, delim) : [l]));
  let col = 0;
  if (rows.length) {
    const head = rows[0].map((h) => fold(h).trim());
    const idx = head.findIndex((h) => /^(client|client name|clientname|name|customer|customer name|company|company name)$/.test(h));
    if (idx >= 0) { col = idx; rows = rows.slice(1); }
  }
  const names = rows.map((r) => String(r[col] || '').replace(/^"|"$/g, '').trim().replace(/\s+/g, ' ').slice(0, 120)).filter(Boolean);
  const existing = new Map(liveClients().map((c) => [normName(c.name), c]));
  const seen = new Set(), toAdd = []; let already = 0, repeats = 0;
  for (const n of names) {
    const k = normName(n); if (!k) continue;
    if (existing.has(k)) { already++; continue; }
    if (seen.has(k)) { repeats++; continue; }
    seen.add(k); toAdd.push(n);
  }
  return { total: names.length, toAdd, already, repeats };
}
let importState = { text: '', isCsv: false };
function renderImportPreview() {
  const el = $('#importPreview'), btn = $('#importGo'); if (!el) return;
  const r = parseClientList(importState.text, importState.isCsv);
  if (!r.total) { el.innerHTML = 'No names yet.'; btn.disabled = true; btn.textContent = 'Import'; return; }
  const n = (x) => x.toLocaleString('en-ZA');
  el.innerHTML = `<strong>${plural(r.total, 'name', 'names')} found.</strong> ${n(r.toAdd.length)} new${r.already ? `, ${n(r.already)} already in your list` : ''}${r.repeats ? `, ${n(r.repeats)} repeated in the list` : ''}. Names are kept exactly as spelt; only differences in capitals count as the same name.${r.toAdd.length ? `<br>First: ${r.toAdd.slice(0, 4).map(esc).join(' · ')}${r.toAdd.length > 4 ? ' …' : ''}` : ''}`;
  btn.disabled = !r.toAdd.length;
  btn.textContent = r.toAdd.length ? `Import ${plural(r.toAdd.length, 'client', 'clients')}` : 'Nothing new to import';
}
function importSheet() {
  importState = { text: '', isCsv: false };
  openSheet(`${sheetHead('Import clients')}
    <p class="muted">Choose a .txt or .csv file with one client per line, or paste the names below. For a spreadsheet, the first column is used, or a column headed Client or Name.</p>
    <button type="button" class="btn btn-secondary" data-action="import-file">Choose a file</button>
    <input type="file" id="importFile" accept=".txt,.csv,text/plain,text/csv" hidden>
    <div class="field"><label class="label" for="importText">Or paste names, one per line</label><textarea class="input" id="importText" rows="6" placeholder="John-Mark Botha&#10;Mokoena Plumbing (Pty) Ltd&#10;Van der Merwe Family Trust"></textarea></div>
    <p class="import-preview" id="importPreview" aria-live="polite">No names yet.</p>
    <button type="button" class="btn btn-primary" id="importGo" data-action="import-go" disabled>Import</button>`);
}
function doImport() {
  const r = parseClientList(importState.text, importState.isCsv);
  const t = now();
  r.toAdd.forEach((name, i) => { const c = { id: newId() + i.toString(36), name, updatedAt: t }; state.clients[c.id] = c; });
  commit(); closeSheet(); ui.clientFilter = ''; render();
  toast(r.toAdd.length ? `Imported ${plural(r.toAdd.length, 'client', 'clients')}` : 'Nothing new to import');
}
function ensureClient(name) {
  let c = findClientByName(name);
  if (c) { if (c.archived) { delete c.archived; c.updatedAt = now(); } return c; }
  c = { id: newId(), name: String(name).trim().replace(/\s+/g, ' ').slice(0, 120), updatedAt: now() };
  state.clients[c.id] = c; return c;
}
function entriesIn(from, to, clientId) {
  return liveEntries().filter((e) => e.date >= from && e.date <= to && (!clientId || e.clientId === clientId));
}
function summarize(list) {
  const by = new Map(); let total = 0;
  for (const e of list) {
    total += e.minutes;
    let g = by.get(e.clientId);
    if (!g) { g = { clientId: e.clientId, minutes: 0, entries: [] }; by.set(e.clientId, g); }
    g.minutes += e.minutes; g.entries.push(e);
  }
  const groups = [...by.values()].sort((a, b) => b.minutes - a.minutes || clientName(a.clientId).localeCompare(clientName(b.clientId)));
  groups.forEach((g) => g.entries.sort(byDate));
  return { total, groups, count: list.length };
}
function uniqueTasks(list) {
  const seen = new Set(), out = [];
  for (const e of list) { const k = e.desc.trim().toLowerCase(); if (k && !seen.has(k)) { seen.add(k); out.push(e.desc.trim()); } }
  return out;
}
function recentClients(limit) {
  const seen = new Set(), out = [];
  const list = liveEntries().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  for (const e of list) {
    const c = state.clients[e.clientId];
    if (!c || c.deleted || c.archived || seen.has(c.id)) continue;
    seen.add(c.id); out.push(c);
    if (out.length >= limit) break;
  }
  if (out.length < limit && liveClients().length <= 12) {
    for (const c of liveClients().filter((c) => !c.archived).sort((a, b) => a.name.localeCompare(b.name))) {
      if (!seen.has(c.id)) { out.push(c); seen.add(c.id); if (out.length >= limit) break; }
    }
  }
  return out;
}

/* Every change goes through commit(): saved on this phone straight away. */
function commit() { saveLocal(); }

function saveEntry({ id, date, clientName: name, minutes, desc }) {
  const c = ensureClient(name); const t = now();
  const prev = id ? state.entries[id] : null;
  const e = { id: id || newId(), date, clientId: c.id, minutes, desc: desc.trim(), createdAt: prev ? prev.createdAt : t, updatedAt: t };
  if (prev && prev.sample) e.sample = true;
  state.entries[e.id] = e; commit(); return e;
}
function deleteEntry(id) { const e = state.entries[id]; if (!e) return; state.entries[id] = Object.assign({}, e, { deleted: true, updatedAt: now() }); commit(); }
function undeleteEntry(id) { const e = state.entries[id]; if (!e) return; const n = Object.assign({}, e, { updatedAt: now() }); delete n.deleted; state.entries[id] = n; commit(); }

/* ------------------------------------------------------ install + storage */
let installPrompt = null;
let persisted = null;
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; if (ui.tab === 'settings' && !ui.detail) renderSettings(); });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('Installed. Open it from your home screen.'); if (ui.tab === 'settings' && !ui.detail) renderSettings(); });
async function requestPersist() {
  try {
    if (navigator.storage && navigator.storage.persisted) {
      persisted = await navigator.storage.persisted();
      if (!persisted && navigator.storage.persist) persisted = await navigator.storage.persist();
    }
  } catch (e) { persisted = null; }
  if (ui.tab === 'settings' && !ui.detail) renderStorageCard();
}
const BACKUP_DUE_DAYS = 14;
function backupDue() {
  if (liveEntries().filter((e) => !e.sample).length < 5) return false;
  return now() - (state.settings.lastFileBackup || 0) > BACKUP_DUE_DAYS * 864e5;
}

/* Back button: closes an open sheet or client detail instead of leaving the app. */
const navStack = [];
let ignorePops = 0;
function navPush(kind) { navStack.push(kind); try { history.pushState({ tsNav: navStack.length }, ''); } catch (e) { /* ignore */ } }
function navPopSilently(kind) {
  const i = navStack.lastIndexOf(kind); if (i === -1) return;
  navStack.splice(i, 1); ignorePops++;
  try { history.back(); } catch (e) { ignorePops--; }
}
window.addEventListener('popstate', () => {
  if (ignorePops > 0) { ignorePops--; return; }
  const kind = navStack.pop();
  if (kind === 'sheet') closeSheet(true);
  else if (kind === 'detail') { ui.detail = null; render(); }
});

/* -------------------------------------------------------------------- views */
const TITLES = { log: 'Log time', summary: 'Summary', clients: 'Clients', settings: 'Settings' };
const ICON_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
const ICON_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

function syncInfo() {
  if (!storageOk) return { tone: 'warn', short: 'Not saving', long: "This browser isn't letting the app save, so entries will be lost when it closes. Check you're not in an incognito tab, and download a backup file now." };
  if (backupDue()) return { tone: 'busy', short: 'Back up due', long: 'Entries are saved on this phone. It has been a while since the last backup file.' };
  return { tone: 'ok', short: 'On this phone', long: 'Entries are saved on this phone only.' };
}
function renderSyncPill() {
  const pill = $('#syncPill'); if (!pill) return;
  const s = syncInfo();
  pill.dataset.tone = s.tone;
  $('#syncText').textContent = s.short;
  pill.setAttribute('aria-label', s.long);
}

function render(opts) {
  opts = opts || {};
  $('#title').textContent = ui.detail ? (ui.detail.mode === 'all' ? 'Client history' : 'Client detail') : TITLES[ui.tab];
  $$('.tab').forEach((b) => { if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  renderSyncPill();
  $('#clientNames').innerHTML = liveClients().filter((c) => !c.archived).sort((a, b) => a.name.localeCompare(b.name)).map((c) => `<option value="${esc(c.name)}"></option>`).join('');
  if (ui.detail) return renderDetail();
  if (ui.tab === 'log') {
    if (opts.keepForm && $('#entryForm')) { renderClientChips(); renderDayList(); renderSampleBanner(); return; }
    return renderLog();
  }
  if (ui.tab === 'summary') return renderSummary();

}

/* ---- Summary */
const MODE_NAMES = { day: 'Today', week: 'This week', month: 'This month' };
function renderSummary() {
  const mode = ui.sumMode;

  const list = entriesIn(r.from, r.to);
  const s = summarize(list);
  const isCurrent = range(mode, todayStr()).from === r.from;
  const groups = s.groups.map((g) => {

    return `<button type="button" class="crow" data-action="open-detail" data-client="${esc(g.clientId)}">

      <span class="crow-meta"><span class="num">${fmtDec(g.minutes)} h · ${plural(g.entries.length, 'entry', 'entries')} · ${share}%</span><span class="crow-go">Detail ›</span></span>
    </button>`;
  }).join('');
  const noneAtAll = liveEntries().length === 0;
  $('#view').innerHTML = `
    ${sampleBannerHtml()}
    <div class="seg" role="tablist" aria-label="Summary period">${['day', 'week', 'month'].map((m) => `<button type="button" role="tab" aria-selected="${m === mode}" data-action="sum-mode" data-mode="${m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div>
    <div class="period">
      <button type="button" class="icon-btn" data-action="sum-step" data-step="-1" aria-label="Previous ${mode}">${ICON_L}</button>
      <div class="period-label"><strong>${esc(periodLabel(mode, r))}</strong>${isCurrent ? `<span class="muted">${MODE_NAMES[mode]}</span>` : `<button type="button" class="link" data-action="sum-today">Back to ${MODE_NAMES[mode].toLowerCase()}</button>`}</div>
      <button type="button" class="icon-btn" data-action="sum-step" data-step="1" aria-label="Next ${mode}">${ICON_R}</button>
    </div>
    <section class="card" aria-label="Total for this period">
      <div class="total-fig">${fmtDur(s.total)}</div>
      <div class="total-sub num">${fmtDec(s.total)} h · ${plural(s.count, 'entry', 'entries')} · ${plural(s.groups.length, 'client', 'clients')}</div>
      ${mode !== 'day' ? barsHtml(mode, r, list) : ''}
    </section>
    ${s.groups.length ? `<h2 class="section-h">By client</h2><div class="stack">${groups}</div>
      <div class="btn-row"><button type="button" class="btn btn-secondary" data-action="copy-summary">Copy summary</button><button type="button" class="btn btn-secondary" data-action="export-period">Export CSV</button></div>`
      : `<div class="card empty"><p><strong>No time logged ${mode === 'day' ? 'on this day' : mode === 'week' ? 'this week' : 'this month'}.</strong></p><p>Entries you save on the Log tab show up here, grouped by client.</p>${noneAtAll ? '<button class="btn btn-secondary btn-sm" type="button" data-action="load-samples">Try it with sample entries</button>' : ''}</div>`}`;
}
function barsHtml(mode, r, list) {
  const days = [];
  for (let d = r.from; d <= r.to; d = addDays(d, 1)) days.push(d);
  const per = {}; days.forEach((d) => { per[d] = 0; });
  list.forEach((e) => { per[e.date] += e.minutes; });
  const max = Math.max(0, ...days.map((d) => per[d]));
  const today = todayStr(), month = mode === 'month';
  const cols = days.map((d) => {
    const v = per[d];
    const pct = max ? Math.max(v ? 4 : 0, (v / max) * 100) : 0;
    const dn = fromStr(d).getDate();
    const lbl = month ? ([1, 8, 15, 22, 29].includes(dn) ? dn : '') : fmt(d, { weekday: 'short' });
    return `<button type="button" class="bar${d === today ? ' is-today' : ''}${v ? '' : ' is-zero'}" data-action="go-day" data-date="${d}" aria-label="${esc(fmtDayShort(d))}: ${fmtDur(v)}"><span class="bar-track"><span class="bar-fill" style="height:${pct.toFixed(1)}%"></span></span><span class="bar-lbl">${lbl}</span></button>`;
  }).join('');
  return `<div class="chart"><div class="chart-max num">${max ? `Busiest day ${fmtDur(max)} · tap a day for detail` : 'No time logged yet'}</div><div class="bars${month ? ' bars-month' : ''}" style="--cols:${days.length}">${cols}</div></div>`;
}

/* ---- Client detail */
function renderDetail() {
  const d = ui.detail;
  const c = state.clients[d.clientId];
  const r = range(d.mode, d.anchor);

  if (!list.length) body = `<div class="card empty"><p>No entries for this client ${all ? 'yet' : 'in this period'}.</p></div>`;
  else if (all) {
    const months = new Map();
    for (const e of list) { const k = e.date.slice(0, 7); if (!months.has(k)) months.set(k, []); months.get(k).push(e); }
    body = [...months.entries()].map(([k, es]) => `<div class="month-h"><span>${esc(fmtMonth(k + '-01'))}</span><span class="num">${fmtDur(es.reduce((a, e) => a + e.minutes, 0))}</span></div><div class="card list">${dateGroupsHtml(es)}</div>`).join('');
  } else body = `<div class="card list">${dateGroupsHtml(list)}</div>`;
  const back = d.from === 'clients' ? 'Clients' : 'Summary';
  $('#view').innerHTML = `
    <button type="button" class="back" data-action="close-detail">${ICON_L}${back}</button>
    <header>
      <h2 class="detail-name">${esc(clientName(d.clientId))}${c && c.archived ? '<span class="archived-tag">Archived</span>' : ''}</h2>
      <p class="detail-sub">${esc(periodLabel(d.mode, r))}</p>
    </header>
    <section class="card">
      <div class="total-fig">${fmtDur(total)}</div>
      <div class="total-sub num">${fmtDec(total)} h · ${plural(list.length, 'entry', 'entries')} · ${plural(uniqueTasks(list).length, 'task', 'tasks')}</div>
    </section>
    ${body}
    <div class="btn-col">
      <button type="button" class="btn btn-primary" data-action="log-for-client">Log time for this client</button>
      ${list.length ? '<div class="btn-row"><button type="button" class="btn btn-secondary" data-action="copy-detail">Copy as text</button><button type="button" class="btn btn-secondary" data-action="export-detail">Export CSV</button></div>' : ''}
      ${c && !c.deleted ? `<div class="btn-row"><button type="button" class="btn btn-ghost" data-action="rename-client">Rename client</button><button type="button" class="btn btn-ghost" data-action="toggle-archive">${c.archived ? 'Unarchive' : 'Archive client'}</button></div>` : ''}
    </div>`;
}
function dateGroupsHtml(list) {
  const groups = new Map();
  for (const e of list) { if (!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push(e); }
  return [...groups.entries()].map(([date, es]) => `<div class="date-h"><span>${esc(fmtDayShort(date))}</span><span class="num">${es.length > 1 ? fmtDur(es.reduce((a, e) => a + e.minutes, 0)) + ' total' : ''}</span></div>${es.map((e) => `<button type="button" class="entry" data-action="edit-entry" data-id="${esc(e.id)}" style="border-top:0;padding-top:6px"><span class="e-desc-strong">${esc(e.desc || 'No description')}</span><span class="e-time num">${fmtDur(e.minutes)}</span></button>`).join('')}`).join('');
}

function renderClientList() {
  const box = $('#clientListBox'); if (!box) return;
  const m = range('month', todayStr());
  const stats = {};
  for (const e of liveEntries()) {
    const s = stats[e.clientId] || (stats[e.clientId] = { total: 0, month: 0, last: '' });
    s.total += e.minutes;
    if (e.date >= m.from && e.date <= m.to) s.month += e.minutes;
    if (e.date > s.last) s.last = e.date;
  }
  const f = ui.clientFilter.trim();
  const all = f ? searchClients(f, 200, true) : liveClients().sort((a, b) => a.name.localeCompare(b.name));
  const LIMIT = 150;
  const active = all.filter((c) => !c.archived), archived = all.filter((c) => c.archived);
  const row = (c) => { const s = stats[c.id] || { total: 0, month: 0, last: '' }; return `<button type="button" class="entry" data-action="open-client" data-client="${esc(c.id)}"><span class="e-main"><span class="e-client">${esc(c.name)}</span><span class="cl-sub">This month <span class="num">${fmtDur(s.month)}</span>${s.last ? ` · last worked ${esc(fmtDayShort(s.last))}` : ' · no entries yet'}</span></span><span class="e-time num">${fmtDur(s.total)}</span></button>`; };

  else {
    if (active.length) html += `<div class="list-head"><h2 class="section-h">${f ? 'Matches' : plural(active.length, 'client', 'clients')}</h2><span class="section-h">All time</span></div><div class="card list">${active.slice(0, LIMIT).map(row).join('')}</div>${active.length > LIMIT ? `<p class="muted" style="margin:0;font-size:.875rem">Showing the first ${LIMIT}. Type in the search box to find the others.</p>` : ''}`;

  }

}

}

      <div class="field"><label class="label" for="e-date">Date</label><input class="input" type="date" id="e-date" value="${esc(e.date)}"></div>
      <div class="field"><label class="label" for="e-client">Client</label><input class="input" id="e-client" type="search" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="words" value="${esc(e.clientId ? clientName(e.clientId) : '')}" aria-controls="e-client-ac"><p class="ac-status" id="e-client-status" hidden></p><div class="ac-list" id="e-client-ac" role="listbox" aria-label="Matching clients" hidden></div></div>
      <div class="field"><span class="label" id="e-durLabel">Time spent</span><div class="dur" role="group" aria-labelledby="e-durLabel"><input class="input" id="e-h" inputmode="decimal" aria-label="Hours" value="${e.minutes ? h : ''}" placeholder="0"><span class="unit">h</span><input class="input" id="e-m" inputmode="numeric" pattern="[0-9]*" aria-label="Minutes" value="${e.minutes ? m : ''}" placeholder="0"><span class="unit">min</span></div></div>
      <div class="field"><label class="label" for="e-desc">Task performed</label><textarea class="input" id="e-desc" rows="3">${esc(e.desc)}</textarea></div>
      <p class="form-error" id="editError" role="alert" hidden></p>
      <div class="btn-row">${isNew ? '<button type="button" class="btn btn-secondary" data-action="close-sheet">Cancel</button>' : `<button type="button" class="btn btn-danger-text" data-action="delete-entry" data-id="${esc(entry.id)}">Delete</button>`}<button type="submit" class="btn btn-primary">Save</button></div>
    </form>`, { entryId: entry ? entry.id : null });
}
function nameSheet(title, value, onSave) {
  openSheet(`${sheetHead(title)}<form class="form" id="nameForm" novalidate><div class="field"><label class="label" for="n-name">Client name</label><input class="input" id="n-name" autocomplete="off" autocapitalize="words" value="${esc(value || '')}" data-autofocus></div><p class="form-error" id="nameError" role="alert" hidden></p><button type="submit" class="btn btn-primary">Save</button></form>`, { onSave });
}

let toastT = 0;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" id="toastAction">${esc(action.label)}</button>` : ''}`;
  el.classList.add('show');
  if (action) $('#toastAction').onclick = () => { el.classList.remove('show'); action.run(); };
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), action ? 6000 : 3000);
}
function showError(id, msg, focusId) {
  const el = $('#' + id); if (!el) return;
  el.textContent = msg; el.hidden = !msg;
  if (msg && focusId) { const f = $('#' + focusId); if (f) f.focus(); }
}

/* ---------------------------------------------------------- export + copy */
const csvCell = (v) => {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) || s.startsWith("'") ? `"${s.replace(/"/g, '""')}"` : s;
};
function csvFor(list) {
  const rows = [['Date', 'Client', 'Hours', 'Duration', 'Task performed']];
  for (const e of list.slice().sort((a, b) => byDate(a, b) || clientName(a.clientId).localeCompare(clientName(b.clientId)))) rows.push([e.date, clientName(e.clientId), fmtDec(e.minutes), fmtDur(e.minutes), e.desc]);
  return rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}
async function offerFile(filename, text, mime, preferShare) {
  const blob = new Blob([(filename.endsWith('.csv') ? '\uFEFF' : '') + text], { type: mime });
  if (preferShare) {
    try {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(`Downloaded ${filename}`);
    return true;
  } catch (e) {
    textSheet('Copy this text', text, "This browser couldn't save the file, so copy the text instead.");
    return false;
  }
}
async function copyText(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done || 'Copied'); }
  catch (e) { textSheet('Copy text', text); }
}
function summaryText(mode, r, list) {
  const s = summarize(list);
  let out = `Timesheet · ${periodLabel(mode, r)}\nTotal ${fmtDur(s.total)} (${fmtDec(s.total)} h) · ${plural(s.count, 'entry', 'entries')}\n`;
  for (const g of s.groups) {
    out += `\n${clientName(g.clientId)} · ${fmtDur(g.minutes)} (${fmtDec(g.minutes)} h)\n`;
    for (const e of g.entries) out += `  ${fmtDayShort(e.date)} · ${fmtDur(e.minutes)} · ${e.desc}\n`;
  }
  return out;
}
function detailText(clientId, mode, r, list) {
  const total = list.reduce((a, e) => a + e.minutes, 0);
  let out = `${clientName(clientId)} · ${periodLabel(mode, r)}\nTotal ${fmtDur(total)} (${fmtDec(total)} h)\n`;
  let last = '';
  for (const e of list.slice().sort(byDate)) {
    if (e.date !== last) { out += `\n${fmtDayShort(e.date)}\n`; last = e.date; }
    out += `  ${fmtDur(e.minutes)} · ${e.desc}\n`;
  }
  return out;
}

/* ------------------------------------------------------------ sample data */
const SAMPLE_CLIENTS = ['Mokoena Plumbing (Pty) Ltd', 'Van der Merwe Family Trust', 'Khumalo & Associates', 'Bright Smile Dental', 'Cape Crust Bakery CC'];
const SAMPLE_TASKS = [
  'Prepared VAT201 return and submitted on eFiling', 'EMP201 payroll submission', 'Reconciled bank statements for the month',
  'Drafted annual financial statements', 'Calculated IRP6 provisional tax', 'Replied to SARS query on input VAT',
  'Filed CIPC annual return', 'Monthly management accounts', 'Payroll run and payslips', 'Year-end planning meeting with client',
  'Captured supplier invoices', 'UIF declaration', 'Reviewed debtors age analysis', 'Prepared ITR14 company tax return', 'Updated fixed asset register',
];
function loadSamples() {
  const t = now();
  const clients = SAMPLE_CLIENTS.map((n, i) => {
    const ex = findClientByName(n); if (ex) return ex;
    const c = { id: newId() + i, name: n, updatedAt: t, sample: true }; state.clients[c.id] = c; return c;
  });
  let seed = 20261031;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const today = todayStr();
  let k = 0;
  for (let d = addDays(weekStart(today), -28); d <= today; d = addDays(d, 1)) {
    const dow = (fromStr(d).getDay() + 6) % 7;
    if (dow > 4 && d !== today) continue;
    const n = d === today ? 2 : 2 + Math.floor(rnd() * 3);
    for (let j = 0; j < n; j++) {
      const c = clients[Math.floor(rnd() * clients.length)];
      const id = newId() + (k++);
      state.entries[id] = { id, date: d, clientId: c.id, minutes: (2 + Math.floor(rnd() * 24)) * 6, desc: SAMPLE_TASKS[Math.floor(rnd() * SAMPLE_TASKS.length)], createdAt: t + k, updatedAt: t, sample: true };
    }
  }
  commit(); render(); toast('Sample entries loaded');
}
function removeSamples() {
  const t = now();
  for (const e of Object.values(state.entries)) if (e.sample && !e.deleted) state.entries[e.id] = Object.assign({}, e, { deleted: true, updatedAt: t });
  const used = new Set(liveEntries().map((e) => e.clientId));
  for (const c of Object.values(state.clients)) if (c.sample && !c.deleted && !used.has(c.id)) state.clients[c.id] = Object.assign({}, c, { deleted: true, updatedAt: t });
  if (ui.detail && !used.has(ui.detail.clientId)) { navPopSilently('detail'); ui.detail = null; }
  commit(); render(); toast('Sample entries removed');
}

/* ----------------------------------------------------------------- actions */
function setTab(tab) {
  if (ui.detail) navPopSilently('detail');
  ui.tab = tab; ui.detail = null; saveUi();
  render(); $('#view').scrollTop = 0;
}
function submitLog() {
  const minutes = parseDur(draft.h, draft.m);
  if (!isDateStr(draft.date)) return showError('formError', 'Choose a date.', 'f-date');
  if (!draft.client.trim()) return showError('formError', 'Enter the client name.', 'f-client');
  if (!minutes) return showError('formError', 'Enter the time spent.', 'f-h');
  if (minutes > 1440) return showError('formError', "One entry can't be more than 24 hours.", 'f-h');
  if (!draft.desc.trim()) return showError('formError', 'Describe the task you performed.', 'f-desc');
  if (!checkClient('f-client', 'formError')) return;
  const e = saveEntry({ date: draft.date, clientName: draft.client, minutes, desc: draft.desc });
  draft = { date: draft.date, client: '', h: '', m: '', desc: '' };
  if (document.activeElement) document.activeElement.blur();
  renderLog();
  toast(`Saved ${fmtDur(minutes)} for ${clientName(e.clientId)}`);
}
function submitEdit() {
  const date = $('#e-date').value, name = $('#e-client').value, desc = $('#e-desc').value;
  const minutes = parseDur($('#e-h').value, $('#e-m').value);
  if (!isDateStr(date)) return showError('editError', 'Choose a date.', 'e-date');
  if (!name.trim()) return showError('editError', 'Enter the client name.', 'e-client');
  if (!minutes) return showError('editError', 'Enter the time spent.', 'e-h');
  if (minutes > 1440) return showError('editError', "One entry can't be more than 24 hours.", 'e-h');
  if (!desc.trim()) return showError('editError', 'Describe the task you performed.', 'e-desc');
  if (!checkClient('e-client', 'editError')) return;
  saveEntry({ id: sheetCtx && sheetCtx.entryId, date, clientName: name, minutes, desc });
  closeSheet(); render({ keepForm: true }); toast('Entry saved');
}
function submitName() {
  const name = $('#n-name').value.trim().replace(/\s+/g, ' ');
  if (!name) return showError('nameError', 'Enter a name.', 'n-name');
  const res = sheetCtx && sheetCtx.onSave ? sheetCtx.onSave(name) : null;
  if (res) return showError('nameError', res, 'n-name');
  closeSheet(); render({ keepForm: true });
}
function setDur(min) {
  min = Math.max(0, Math.min(1440, min));
  draft.h = min ? String(Math.floor(min / 60)) : '';
  draft.m = min ? String(min % 60) : '';
  const h = $('#f-h'), m = $('#f-m');
  if (h) h.value = draft.h; if (m) m.value = draft.m;
  updateDec();
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;
  switch (a) {
    case 'tab': setTab(t.dataset.tab); break;
    case 'close-sheet': closeSheet(); break;
    case 'sheet-confirm': { const fn = sheetCtx && sheetCtx.onConfirm; closeSheet(); if (fn) fn(); break; }
    case 'copy-area': { const ta = $('#copyArea'); if (!ta) break; ta.select(); navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => { try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Press and hold the text to copy it.'); } }); break; }

    case 'draft-day': draft.date = addDays(isDateStr(draft.date) ? draft.date : todayStr(), Number(t.dataset.step)); $('#f-date').value = draft.date; renderDayList(); break;
    case 'pick-client': { const c = state.clients[t.dataset.id]; if (!c) break; draft.client = c.name; $('#f-client').value = c.name; renderClientChips(); break; }
    case 'add-min': setDur(parseDur(draft.h, draft.m) + Number(t.dataset.min)); break;
    case 'clear-dur': setDur(0); break;
    case 'timer-start': state.timer = { start: now() }; saveLocal(); renderTimer(); break;
    case 'timer-discard': state.timer = null; saveLocal(); renderTimer(); toast('Timer discarded'); break;
    case 'timer-stop': {
      if (!state.timer) break;
      const unit = state.settings.round || 1;
      let min = Math.max(1, Math.ceil((now() - state.timer.start) / 60000));
      min = Math.ceil(min / unit) * unit;
      state.timer = null; saveLocal(); renderTimer(); setDur(min);
      toast(`Timer stopped at ${fmtDur(min)}. Add the client and task, then save.`);
      break;
    }
    case 'edit-entry': { const e = state.entries[t.dataset.id]; if (e && !e.deleted) editSheet(e); break; }
    case 'delete-entry': {
      const id = t.dataset.id; deleteEntry(id); closeSheet(); render({ keepForm: true });
      toast('Entry deleted', { label: 'Undo', run: () => { undeleteEntry(id); render({ keepForm: true }); } });
      break;
    }
    case 'load-samples': loadSamples(); break;
    case 'remove-samples': removeSamples(); break;

    case 'sum-mode': ui.sumMode = t.dataset.mode; saveUi(); renderSummary(); break;
    case 'sum-step': {
      const s = Number(t.dataset.step);
      ui.sumAnchor = ui.sumMode === 'day' ? addDays(ui.sumAnchor, s) : ui.sumMode === 'week' ? addDays(ui.sumAnchor, 7 * s) : addMonths(ui.sumAnchor, s);
      renderSummary(); break;
    }
    case 'sum-today': ui.sumAnchor = todayStr(); renderSummary(); break;
    case 'go-day': ui.sumMode = 'day'; ui.sumAnchor = t.dataset.date; saveUi(); renderSummary(); $('#view').scrollTop = 0; break;
    case 'open-detail': if (!ui.detail) navPush('detail'); ui.detail = { clientId: t.dataset.client, mode: ui.sumMode, anchor: ui.sumAnchor, from: 'summary' }; render(); $('#view').scrollTop = 0; break;
    case 'open-client': if (!ui.detail) navPush('detail'); ui.detail = { clientId: t.dataset.client, mode: 'all', anchor: todayStr(), from: 'clients' }; render(); $('#view').scrollTop = 0; break;
    case 'close-detail': navPopSilently('detail'); ui.detail = null; render(); break;
    case 'copy-summary': { const r = range(ui.sumMode, ui.sumAnchor); copyText(summaryText(ui.sumMode, r, entriesIn(r.from, r.to)), 'Summary copied'); break; }
    case 'export-period': { const r = range(ui.sumMode, ui.sumAnchor); offerFile(`timesheet_${r.from}_to_${r.to}.csv`, csvFor(entriesIn(r.from, r.to)), 'text/csv', true); break; }
    case 'copy-detail': { const d = ui.detail; const r = range(d.mode, d.anchor); copyText(detailText(d.clientId, d.mode, r, entriesIn(r.from, r.to, d.clientId)), 'Copied'); break; }
    case 'export-detail': { const d = ui.detail; const r = range(d.mode, d.anchor); const list = entriesIn(r.from, r.to, d.clientId); offerFile(`timesheet_${slug(clientName(d.clientId))}_${d.mode === 'all' ? 'all' : r.from + '_to_' + r.to}.csv`, csvFor(list), 'text/csv', true); break; }
    case 'log-for-client': { draft.client = clientName(ui.detail.clientId); navPopSilently('detail'); ui.detail = null; ui.tab = 'log'; saveUi(); render(); $('#view').scrollTop = 0; break; }
    case 'rename-client': {
      const c = state.clients[ui.detail.clientId]; if (!c) break;
      nameSheet('Rename client', c.name, (name) => {
        const other = findClientByName(name);
        if (other && other.id !== c.id) return `Already in your list as “${other.name}”.`;
        state.clients[c.id] = Object.assign({}, c, { name, updatedAt: now() }); commit(); toast('Client renamed'); return null;
      });
      break;
    }
    case 'toggle-archive': {
      const c = state.clients[ui.detail.clientId]; if (!c) break;
      const n = Object.assign({}, c, { updatedAt: now() });
      if (c.archived) delete n.archived; else n.archived = true;
      state.clients[c.id] = n; commit(); render();
      toast(n.archived ? 'Archived. It no longer shows in quick picks.' : 'Client unarchived');
      break;
    }
    case 'add-client':
      nameSheet('Add client', ui.clientFilter, (name) => {
        { const ex = findClientByName(name); if (ex) return `Already in your list as “${ex.name}”.`; }
        ensureClient(name); commit(); toast('Client added'); return null;
      });
      break;
    case 'ac-pick': {
      const c = state.clients[t.dataset.id]; const input = $('#' + t.dataset.input); if (!c || !input) break;
      input.value = c.name;
      if (t.dataset.input === 'f-client') { draft.client = c.name; renderClientChips(); const err = $('#formError'); if (err) err.hidden = true; }
      else { const err = $('#editError'); if (err) err.hidden = true; }
      const box = $('#' + t.dataset.input + '-ac'); if (box) delete box.dataset.keep;
      renderAc(t.dataset.input);
      break;
    }
    case 'ac-new': {
      const input = $('#' + t.dataset.input); if (!input) break;
      const name = input.value.trim().replace(/\s+/g, ' ');
      input.value = name; newClientOk.add(normName(name));
      if (t.dataset.input === 'f-client') draft.client = name;
      const box = $('#' + t.dataset.input + '-ac'); if (box) { delete box.dataset.keep; box.hidden = true; box.innerHTML = ''; }
      const err = $(t.dataset.input === 'f-client' ? '#formError' : '#editError'); if (err) err.hidden = true;
      toast(`“${name}” will be added when you save`);
      break;
    }
    case 'import-clients': importSheet(); break;
    case 'import-file': { const f = $('#importFile'); if (f) { f.value = ''; f.click(); } break; }
    case 'import-go': doImport(); break;
    case 'toggle-show-archived': ui.showArchived = !ui.showArchived; renderClientList(); break;

    case 'set-round': state.settings.round = Number(t.dataset.val); saveLocal(); renderSettings(); break;
    case 'download-backup': {
      const data = { app: 'client-timesheet', version: 1, exportedAt: new Date().toISOString(), clients: liveClients(), entries: liveEntries().sort(byDate) };
      offerFile(`timesheet-backup-${todayStr()}.json`, JSON.stringify(data, null, 1), 'application/json', false).then((ok) => {
        if (ok) { state.settings.lastFileBackup = now(); saveLocal(); render({ keepForm: true }); }
      });
      break;
    }
    case 'restore-backup': $('#restoreFile').value = ''; $('#restoreFile').click(); break;
    case 'export-all': offerFile(`timesheet_all_${todayStr()}.csv`, csvFor(liveEntries()), 'text/csv', true); break;
    case 'install':
      if (installPrompt) { const p = installPrompt; installPrompt = null; p.prompt(); Promise.resolve(p.userChoice).catch(() => {}).then(() => { if (ui.tab === 'settings' && !ui.detail) renderSettings(); }); }
      break;
    case 'delete-all':
      confirmSheet({
        title: 'Delete all entries?', danger: true, confirmLabel: 'Delete everything',
        body: `This removes ${plural(liveEntries().length, 'entry', 'entries')} and ${plural(liveClients().length, 'client', 'clients')} from this phone. Download a backup file first if you might need them.`,
        onConfirm: () => {
          const t = now();
          for (const e of Object.values(state.entries)) if (!e.deleted) state.entries[e.id] = Object.assign({}, e, { deleted: true, updatedAt: t });
          for (const c of Object.values(state.clients)) if (!c.deleted) state.clients[c.id] = Object.assign({}, c, { deleted: true, updatedAt: t });
          commit(); render(); toast('All entries deleted');
        },
      });
      break;
    default: break;
  }
});

document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const id = ev.target.id;
  if (id === 'entryForm') submitLog();
  else if (id === 'editForm') submitEdit();
  else if (id === 'nameForm') submitName();
});

const DRAFT_FIELDS = { 'f-date': 'date', 'f-client': 'client', 'f-h': 'h', 'f-m': 'm', 'f-desc': 'desc' };
document.addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (DRAFT_FIELDS[id]) {
    draft[DRAFT_FIELDS[id]] = ev.target.value;
    if (id === 'f-h' || id === 'f-m') updateDec();
    if (id === 'f-client') { renderClientChips(); renderAc('f-client'); }
    if (id === 'f-date' && isDateStr(ev.target.value)) renderDayList();
    const err = $('#formError'); if (err && !err.hidden) err.hidden = true;
  } else if (id === 'clientFilter') { ui.clientFilter = ev.target.value; renderClientList(); }
  else if (id === 'e-client') { renderAc('e-client'); const err = $('#editError'); if (err) err.hidden = true; }
  else if (id === 'importText') { importState.text = ev.target.value; renderImportPreview(); }
});
document.addEventListener('change', (ev) => {
  const id = ev.target.id;
  if (id === 'f-date' && isDateStr(ev.target.value)) { draft.date = ev.target.value; renderDayList(); }
  else if (id === 'f-m' || id === 'f-h') { const m = parseDur(draft.h, draft.m); if (m && (parseInt(draft.m, 10) >= 60 || /[.,]/.test(draft.h))) setDur(m); }
  else if (id === 'importFile') {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    f.text().then((txt) => {
      importState = { text: txt, isCsv: /\.csv$/i.test(f.name) || /csv/.test(f.type) };
      const ta = $('#importText'); if (ta) ta.value = txt.length > 200000 ? txt.slice(0, 200000) : txt;
      renderImportPreview();
    }).catch(() => toast("Couldn't read that file."));
  }
  else if (id === 'restoreFile') {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    f.text().then((txt) => restoreFrom(txt)).catch(() => toast("Couldn't read that file."));
  }
});
function restoreFrom(txt) {
  let data;
  try { data = JSON.parse(txt); } catch (e) { toast("That file isn't a timesheet backup."); return; }
  if (!data || !Array.isArray(data.entries) || !Array.isArray(data.clients)) { toast("That file isn't a timesheet backup."); return; }
  const t = now(); let added = 0;
  for (const raw of data.clients) {
    const c = cleanClient(raw); if (!c || c.deleted) continue;
    const l = state.clients[c.id];
    if (!l || l.deleted || c.updatedAt > l.updatedAt) { c.updatedAt = Math.max(t, c.updatedAt); state.clients[c.id] = c; }
  }
  for (const raw of data.entries) {
    const e = cleanEntry(raw); if (!e || e.deleted) continue;
    const l = state.entries[e.id];
    if (!l || l.deleted || e.updatedAt > l.updatedAt) { if (!l || l.deleted) added++; e.updatedAt = Math.max(t, e.updatedAt); state.entries[e.id] = e; }
  }
  for (const e of liveEntries()) if (!state.clients[e.clientId] || state.clients[e.clientId].deleted) {
    const c = state.clients[e.clientId];
    if (c) { const n = Object.assign({}, c, { updatedAt: t }); delete n.deleted; state.clients[c.id] = n; }
  }
  commit(); render(); toast(added ? `Restored ${plural(added, 'entry', 'entries')}` : 'Everything in that file is already here');
}

document.addEventListener('pointerdown', (ev) => { if (ev.target.closest('.ac-item')) ev.preventDefault(); });
document.addEventListener('focusin', (ev) => { if (ev.target.id === 'f-client' || ev.target.id === 'e-client') renderAc(ev.target.id); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });

/* Timer tick and day rollover */
setInterval(() => {
  const el = $('#tElapsed');
  if (el && state.timer) el.textContent = elapsedStr(state.timer.start);
}, 1000);
function checkNewDay() {
  const t = todayStr();
  if (t === lastToday) return;
  if (draft.date === lastToday) draft.date = t;
  if (ui.sumAnchor === lastToday) ui.sumAnchor = t;
  lastToday = t;
  render({ keepForm: false });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
setInterval(checkNewDay, 60000);

/* ------------------------------------------------------------------- start */
loadLocal();
render();
requestPersist();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* still works online */ }); });
}
})();
